name: Laravel project

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    outputs:
      pages_url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, mysql, pdo_mysql, bcmath, soap, intl, gd
        coverage: xdebug

    - name: Install Dependencies
      run: composer install --no-progress --prefer-dist --optimize-autoloader
      working-directory: laravel-project

    - name: Setup Environment
      run: |
        cp .env.example .env
        php artisan key:generate
        php -r "
          file_put_contents('.env', str_replace(
            ['DB_CONNECTION=mysql', 'DB_DATABASE=qa_assessment'],
            ['DB_CONNECTION=sqlite', 'DB_DATABASE=:memory:'],
            file_get_contents('.env')
          ));
        "
        php artisan config:clear
        php artisan cache:clear
      working-directory: laravel-project

    - name: Directory Permissions
      run: chmod -R 775 storage bootstrap/cache
      working-directory: laravel-project

    - name: Run Migrations
      run: php artisan migrate --force
      working-directory: laravel-project

    - name: Execute tests (Unit and Feature tests) via PHPUnit
      continue-on-error: true
      id: phpunit
      run: vendor/bin/phpunit --log-junit storage/test-results/junit.xml
      working-directory: laravel-project

    - name: Build HTML report
      if: always()
      run: |
        mkdir -p reports
        if [ -f laravel-project/storage/test-results/junit.xml ]; then
          cp laravel-project/storage/test-results/junit.xml reports/junit.xml
        fi
        cat > reports/index.html <<'HTML'
        <!doctype html>
        <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Laravel PHPUnit Report</title>
            <style>
              body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 2rem; }
              h1 { margin: 0 0 0.5rem; }
              p { margin: 0.25rem 0 1rem; }
              a { color: #0b5fff; text-decoration: none; }
              a:hover { text-decoration: underline; }
              code { background: #f5f5f5; padding: 0.1rem 0.3rem; border-radius: 4px; }
            </style>
          </head>
          <body>
            <h1>Laravel PHPUnit Report</h1>
            <p>Generated by GitHub Actions.</p>
            <p>JUnit XML: <a href="junit.xml">junit.xml</a></p>
          </body>
        </html>
        HTML

    - name: Upload PHPUnit report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: phpunit-report-laravel
        path: laravel-project/storage/test-results/junit.xml

    - name: Upload Laravel logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: laravel-logs-laravel
        path: laravel-project/storage/logs/*.log

    - name: Configure Pages
      if: always()
      uses: actions/configure-pages@v5

    - name: Upload Pages artifact
      if: always()
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./reports

    - name: Deploy to GitHub Pages
      if: always()
      id: deployment
      uses: actions/deploy-pages@v4

    - name: Fail pipeline if PHPUnit failed
      if: steps.phpunit.outcome == 'failure'
      run: exit 1
